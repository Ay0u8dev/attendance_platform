name: Pull Request CI

# This workflow is both the main-branch PR quality gate and the reusable
# validation stage called before release images are built.
on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  # Missing SonarCloud configuration is an operational error. This check never
  # prints the token; it only reports which repository setting is absent.
  sonar_configuration:
    name: Require SonarCloud configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required SonarCloud settings
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          missing=0
          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository variable SONAR_HOST_URL is required."
            missing=1
          fi
          if [[ -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository variable SONAR_ORGANIZATION is required."
            missing=1
          fi
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository secret SONAR_TOKEN is required."
            missing=1
          fi
          if (( missing != 0 )); then
            exit 1
          fi
          echo "::notice title=SonarCloud enabled::Required CI-based analysis is configured; Quality Gate results remain informational."

  # The matrix applies the same compile, test, coverage, and SonarCloud policy
  # to every Spring Boot service without duplicating five jobs.
  java:
    name: Java - ${{ matrix.service }}
    needs: sonar_configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            sonar_key: auth-service
          - service: user-service
            sonar_key: user-service
          - service: attendance-service
            sonar_key: attendance-service
          - service: justification-service
            sonar_key: justification-service
          - service: notification-service
            sonar_key: notification-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Cache SonarQube analyzer
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ matrix.service }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: Compile, test, and generate coverage
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B \
            clean \
            org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent \
            verify \
            org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Analyze with SonarCloud
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=attendance-platform-${{ matrix.sonar_key }} \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.qualitygate.wait=false

      - name: Upload Java test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-reports-${{ matrix.service }}
          path: |
            backend/${{ matrix.service }}/target/surefire-reports/
            backend/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # Validate the Angular application before scanning its TypeScript sources.
  frontend:
    name: Frontend - build and tests
    needs: sonar_configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm exec -- ng test --watch=false

      - name: Build production frontend
        run: npm run build -- --configuration production

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.projectKey=attendance-platform-frontend
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false

  # pytest produces coverage.xml so SonarCloud can include Python coverage.
  face:
    name: Face service - tests
    needs: sonar_configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/face-service
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/face-service/requirements.txt
            backend/face-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pytest-cov==6.2.1

      - name: Run face-service tests and coverage
        env:
          PYTHONPATH: .
        run: pytest -q --junitxml=test-results.xml --cov=app --cov-report=xml:coverage.xml

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/face-service
          args: >-
            -Dsonar.projectKey=attendance-platform-face-service
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=false

      - name: Upload face-service reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-reports-face-service
          path: |
            backend/face-service/test-results.xml
            backend/face-service/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # QR has no automated suite yet, so compilation and application import are
  # mandatory until real tests are added.
  qr:
    name: QR service - source validation
    needs: sonar_configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/qr-service
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/qr-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check and import QR application
        run: |
          python -m compileall -q .
          python -c "from main import app; assert app is not None"
          echo "::notice title=QR tests::No automated QR test suite currently exists; source compilation and application import passed."

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/qr-service
          args: >-
            -Dsonar.projectKey=attendance-platform-qr-service
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false
