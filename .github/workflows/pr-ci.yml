name: Pull Request CI

# This workflow is both the main-branch PR quality gate and the reusable
# validation stage called before release images are built.
on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      base_sha:
        description: Base commit SHA used to compute changed paths.
        required: false
        type: string
      head_sha:
        description: Head commit SHA used to compute changed paths.
        required: false
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

env:
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  detect_changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java_matrix: ${{ steps.detect.outputs.java_matrix }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      run_face: ${{ steps.detect.outputs.run_face }}
      run_qr: ${{ steps.detect.outputs.run_qr }}
      no_runtime_changes: ${{ steps.detect.outputs.no_runtime_changes }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed service paths
        id: detect
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          base_sha=""
          head_sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_call" ]]; then
            base_sha="${INPUT_BASE_SHA}"
            head_sha="${INPUT_HEAD_SHA}"
          fi

          if [[ -z "${head_sha}" ]]; then
            head_sha="${GITHUB_SHA}"
          fi

          if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "::warning title=Change detection fallback::Head SHA '${head_sha}' not found locally; using checked out HEAD."
            head_sha="$(git rev-parse HEAD)"
          fi

          if [[ -n "${base_sha}" ]] && ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::warning title=Change detection fallback::Base SHA '${base_sha}' not found locally; falling back to previous commit."
            base_sha=""
          fi

          if [[ -z "${base_sha}" ]]; then
            if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "${head_sha}^")"
            else
              base_sha="${head_sha}"
            fi
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"

          declare -A java_changed=(
            ["auth-service"]=false
            ["user-service"]=false
            ["attendance-service"]=false
            ["justification-service"]=false
            ["notification-service"]=false
          )
          run_frontend=false
          run_face=false
          run_qr=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              backend/auth-service/*)
                java_changed["auth-service"]=true
                ;;
              backend/user-service/*)
                java_changed["user-service"]=true
                ;;
              backend/attendance-service/*)
                java_changed["attendance-service"]=true
                ;;
              backend/justification-service/*)
                java_changed["justification-service"]=true
                ;;
              backend/notification-service/*)
                java_changed["notification-service"]=true
                ;;
              backend/face-service/*)
                run_face=true
                ;;
              backend/qr-service/*)
                run_qr=true
                ;;
              frontend/*)
                run_frontend=true
                ;;
              .github/workflows/pr-ci.yml|.github/workflows/release.yml)
                for service in auth-service user-service attendance-service justification-service notification-service; do
                  java_changed["${service}"]=true
                done
                run_frontend=true
                run_face=true
                run_qr=true
                ;;
            esac
          done <<< "${changed_files}"

          java_matrix='[]'
          for service in auth-service user-service attendance-service justification-service notification-service; do
            if [[ "${java_changed[${service}]}" == "true" ]]; then
              java_matrix="$(jq -c --arg service "${service}" '. + [{service: $service, sonar_key: $service}]' <<< "${java_matrix}")"
            fi
          done

          runtime_changes=false
          if [[ "${run_frontend}" == "true" || "${run_face}" == "true" || "${run_qr}" == "true" ]]; then
            runtime_changes=true
          elif [[ "$(jq 'length' <<< "${java_matrix}")" -gt 0 ]]; then
            runtime_changes=true
          fi

          no_runtime_changes=true
          if [[ "${runtime_changes}" == "true" ]]; then
            no_runtime_changes=false
          fi

          {
            echo "java_matrix=${java_matrix}"
            echo "run_frontend=${run_frontend}"
            echo "run_face=${run_face}"
            echo "run_qr=${run_qr}"
            echo "no_runtime_changes=${no_runtime_changes}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${no_runtime_changes}" == "true" ]]; then
            echo "::notice title=Selective CI::No mapped runtime service paths changed; heavy service jobs will be skipped."
          fi

  # Missing SonarCloud configuration is an operational error. This check never
  # prints the token; it only reports which repository setting is absent.
  sonar_configuration:
    name: Require SonarCloud configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required SonarCloud settings
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          missing=0
          if [[ -z "$SONAR_HOST_URL" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository variable SONAR_HOST_URL is required."
            missing=1
          fi
          if [[ -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository variable SONAR_ORGANIZATION is required."
            missing=1
          fi
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error title=Missing SonarCloud configuration::Repository secret SONAR_TOKEN is required."
            missing=1
          fi
          if (( missing != 0 )); then
            exit 1
          fi
          echo "::notice title=SonarCloud enabled::Required CI-based analysis is configured; Quality Gate results remain informational."

  # The matrix applies the same compile, test, coverage, and SonarCloud policy
  # to every Spring Boot service without duplicating five jobs.
  java:
    name: Java - ${{ matrix.service }}
    needs:
      - detect_changes
      - sonar_configuration
    if: ${{ needs.detect_changes.outputs.java_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect_changes.outputs.java_matrix) }}
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Cache SonarQube analyzer
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ matrix.service }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: Compile, test, and generate coverage
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B \
            clean \
            org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent \
            verify \
            org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Analyze with SonarCloud
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=attendance-platform-${{ matrix.sonar_key }} \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.qualitygate.wait=false

      - name: Upload Java test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-reports-${{ matrix.service }}
          path: |
            backend/${{ matrix.service }}/target/surefire-reports/
            backend/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # Validate the Angular application before scanning its TypeScript sources.
  frontend:
    name: Frontend - build and tests
    needs:
      - detect_changes
      - sonar_configuration
    if: ${{ needs.detect_changes.outputs.run_frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm exec -- ng test --watch=false

      - name: Build production frontend
        run: npm run build -- --configuration production

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.projectKey=attendance-platform-frontend
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false

  # pytest produces coverage.xml so SonarCloud can include Python coverage.
  face:
    name: Face service - tests
    needs:
      - detect_changes
      - sonar_configuration
    if: ${{ needs.detect_changes.outputs.run_face == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/face-service
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/face-service/requirements.txt
            backend/face-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pytest-cov==6.2.1

      - name: Run face-service tests and coverage
        env:
          PYTHONPATH: .
        run: pytest -q --junitxml=test-results.xml --cov=app --cov-report=xml:coverage.xml

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/face-service
          args: >-
            -Dsonar.projectKey=attendance-platform-face-service
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=false

      - name: Upload face-service reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-reports-face-service
          path: |
            backend/face-service/test-results.xml
            backend/face-service/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # QR has no automated suite yet, so compilation and application import are
  # mandatory until real tests are added.
  qr:
    name: QR service - source validation
    needs:
      - detect_changes
      - sonar_configuration
    if: ${{ needs.detect_changes.outputs.run_qr == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/qr-service
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/qr-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile-check and import QR application
        run: |
          python -m compileall -q .
          python -c "from main import app; assert app is not None"
          echo "::notice title=QR tests::No automated QR test suite currently exists; source compilation and application import passed."

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend/qr-service
          args: >-
            -Dsonar.projectKey=attendance-platform-qr-service
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false

  no_runtime_changes:
    name: No runtime service changes
    needs:
      - detect_changes
      - sonar_configuration
    if: ${{ needs.detect_changes.outputs.no_runtime_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report selective skip
        shell: bash
        run: |
          echo "No mapped runtime service path changed."
          echo "Service jobs were skipped by selective CI policy."
