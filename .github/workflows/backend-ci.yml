name: Backend CI Pipeline

on:
  pull_request:
    branches: [ main, dev ]

  push:
    branches: [ main, dev ]

jobs:

  # -------------------------
  # BUILD (quick validation)
  # -------------------------
  build:
    name: Build Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth-service, attendance-service, user-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ matrix.service }}-${{ hashFiles(format('backend/{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build (skip tests)
        working-directory: backend/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests


  # -------------------------
  # TESTS (parallel services)
  # -------------------------
  attendance-tests:
    name: Test Attendance Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            attendance:
              - 'attendance-service/**'

      - name: Skip if no changes
        if: steps.changes.outputs.attendance != 'true'
        run: echo "No changes in attendance-service" && exit 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-attendance-${{ hashFiles('backend/attendance-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Run tests
        working-directory: backend/attendance-service
        run: |
          chmod +x mvnw
          ./mvnw test


  user-tests:
    name: Test User Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user:
              - 'user-service/**'

      - name: Skip if no changes
        if: steps.changes.outputs.user != 'true'
        run: echo "No changes in user-service" && exit 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-user-${{ hashFiles('backend/user-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Run tests
        working-directory: backend/user-service
        run: |
          chmod +x mvnw
          ./mvnw test
