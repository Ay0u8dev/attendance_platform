spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: never
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
  mail:
    host: localhost
    port: 1025

app:
  internal:
    service-token: test-internal-service-token
  rabbitmq:
    notifications:
      exchange: notifications.exchange
      queue: notification-service.notifications.queue
      routing-key: notification.requested
  notifications:
    email:
      enabled: false
      from: no-reply@attendance.local
      sender-name: Test Attendance Platform
      frontend-base-url: http://localhost:4200
      exchange: notifications.email.exchange
      queue: notification-service.email.queue
      routing-key: notification.email.send
