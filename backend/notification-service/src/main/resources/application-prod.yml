server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}

services:
  auth:
    url: http://auth-service:8080

notification:
  websocket:
    allowed-origin-patterns:
      - http://localhost:[*]
      - http://127.0.0.1:[*]
      - http://host.docker.internal:[*]
      - http://192.168.100.73:[*]
      - http://attendance-platform.ma
      - http://attendance-platform.duckdns.org
