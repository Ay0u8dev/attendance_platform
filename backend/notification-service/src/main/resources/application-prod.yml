server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}
  azure:
    servicebus:
      connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING}
      notifications-queue: ${AZURE_SERVICEBUS_NOTIFICATIONS_QUEUE:notification-service-notifications}
      email-queue: ${AZURE_SERVICEBUS_EMAIL_QUEUE:notification-service-email}
  notifications:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from: ${MAIL_FROM:no-reply@attendance.local}
      sender-name: ${MAIL_SENDER_NAME:Plateforme de gestion de l'assiduite}
      frontend-base-url: ${FRONTEND_BASE_URL:https://attendance-platform.duckdns.org}

services:
  auth:
    url: http://auth-service:8080

notification:
  websocket:
    allowed-origin-patterns:
      - http://localhost:[*]
      - http://127.0.0.1:[*]
      - http://host.docker.internal:[*]
      - http://192.168.100.73:[*]
      - http://attendance-platform.ma
      - http://attendance-platform.duckdns.org
