server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://user-db:5432/users_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  profile-photos:
    storage-dir: ${PROFILE_PHOTOS_STORAGE_DIR}
    public-path: ${PROFILE_PHOTOS_PUBLIC_PATH}
  internal:
    face-service-token: ${FACE_SERVICE_INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
