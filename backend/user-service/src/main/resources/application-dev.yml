server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/users_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  profile-photos:
    storage-dir: ${PROFILE_PHOTOS_STORAGE_DIR:uploads/profile-photos}
    public-path: ${PROFILE_PHOTOS_PUBLIC_PATH:/api/users/public/profile-photos}
  internal:
    face-service-token: ${FACE_SERVICE_INTERNAL_TOKEN:replace-with-a-long-random-secret}
