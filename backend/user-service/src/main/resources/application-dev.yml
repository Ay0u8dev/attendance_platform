server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/users_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  config :
    import: optional:dotenv:.env

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
