server:
  port: 8080

app:
  allowed-domain: "ump.ac.ma"
  allow-all-domains: ${ALLOW_ALL_DOMAINS:false}
  jwt:
    issuer: "auth-service"
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

google:
  client-id: ${GOOGLE_CLIENT_ID}

services:
  user-service:
    url: http://user-service:8080

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
