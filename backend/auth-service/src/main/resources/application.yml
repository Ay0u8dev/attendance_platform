server:
  port: 8081

spring:
  application:
    name: auth-service
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
#    url: jdbc:postgresql://auth-db:5432/users_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


