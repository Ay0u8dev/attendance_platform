server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/attendance_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

services:
  auth-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082

attendance:
  internal:
    # Local services run outside Docker and do not share a .env loader.
    # Missing local tokens keep internal attendance updates disabled instead of blocking startup.
    face-service-token: ${FACE_ATTENDANCE_INTERNAL_TOKEN:}
    qr-service-token: ${QR_ATTENDANCE_INTERNAL_TOKEN:}
  session:
    auto-end-duration: PT30M
    finalized-state-retention: PT1H
    auto-finalize-poll-interval: PT1M
  self-mark:
    max-distance-meters: 100
  websocket:
    allowed-origin-patterns: http://localhost:4200
