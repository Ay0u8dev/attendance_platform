server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/attendance_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

services:
  auth-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082

attendance:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:dummy-token-for-dev}
  session:
    auto-end-duration: PT30M
    finalized-state-retention: PT1H
    auto-finalize-poll-interval: PT1M
  self-mark:
    max-distance-meters: 100
  websocket:
    allowed-origin-patterns: http://localhost:4200
  lock:
    lease-duration: ${ATTENDANCE_LOCK_LEASE_DURATION:PT2M}
    acquire-timeout: ${ATTENDANCE_LOCK_ACQUIRE_TIMEOUT:PT2S}
    retry-interval: ${ATTENDANCE_LOCK_RETRY_INTERVAL:PT0.05S}
