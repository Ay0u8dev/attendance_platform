server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://attendance-db:5432/attendance_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

services:
  auth-service:
    url: http://auth-service:8080
  user-service:
    url: http://user-service:8080
  notification:
    url: http://notification-service:8080

attendance:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}
  session:
    auto-end-duration: PT30M
    finalized-state-retention: PT1H
    auto-finalize-poll-interval: PT30S
  self-mark:
    max-distance-meters: ${ATTENDANCE_SELF_MARK_MAX_DISTANCE_METERS:100}
  websocket:
    allowed-origin-patterns: http://*
  lock:
    lease-duration: ${ATTENDANCE_LOCK_LEASE_DURATION:PT2M}
    acquire-timeout: ${ATTENDANCE_LOCK_ACQUIRE_TIMEOUT:PT2S}
    retry-interval: ${ATTENDANCE_LOCK_RETRY_INTERVAL:PT0.05S}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
