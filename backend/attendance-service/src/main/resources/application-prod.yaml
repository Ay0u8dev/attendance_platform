server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://attendance-db:5432/attendance_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

services:
  auth-service:
    url: http://auth-service:8080
  user-service:
    url: http://user-service:8080

attendance:
  internal:
    face-service-token: ${FACE_ATTENDANCE_INTERNAL_TOKEN}
    qr-service-token: ${QR_ATTENDANCE_INTERNAL_TOKEN}
  session:
    auto-end-duration: PT30M
    finalized-state-retention: PT1H
    auto-finalize-poll-interval: PT30S
  self-mark:
    max-distance-meters: ${ATTENDANCE_SELF_MARK_MAX_DISTANCE_METERS:100}
  websocket:
    allowed-origin-patterns: http://*
  lock:
    lease-duration: ${ATTENDANCE_LOCK_LEASE_DURATION:PT2M}
    acquire-timeout: ${ATTENDANCE_LOCK_ACQUIRE_TIMEOUT:PT2S}
    retry-interval: ${ATTENDANCE_LOCK_RETRY_INTERVAL:PT0.05S}
