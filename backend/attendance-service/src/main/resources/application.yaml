spring:
  application:
    name: attendance-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  profiles:
    active: ${PROFILE:dev}

app:
  rabbitmq:
    notifications:
      exchange: ${NOTIFICATIONS_EXCHANGE:notifications.exchange}
      routing-key: ${NOTIFICATIONS_ROUTING_KEY:notification.requested}
