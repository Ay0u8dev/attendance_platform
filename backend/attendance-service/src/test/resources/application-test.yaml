spring:
  datasource:
    url: jdbc:h2:mem:attendance_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379

attendance:
  session:
    auto-end-duration: PT30M
    finalized-state-retention: PT1H
    auto-finalize-poll-interval: PT1M
  websocket:
    allowed-origin-patterns: http://localhost:4200

services:
  auth-service:
    url: http://localhost:8081
  user-service:
    url: http://localhost:8082
  notification:
    url: http://localhost:8086
