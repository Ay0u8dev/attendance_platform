<section class="space-y-5">
  <app-cycles-list
    [cycles]="filteredCycles()"
    (createClicked)="openCreate()"
    (editClicked)="openEdit($event)"
    (deleteClicked)="openDelete($event)"
    (bulkDeleteRequested)="onBulkDeleteRequested($event)"
  ></app-cycles-list>

  <app-delete-modal
    [open]="isBulkDeleteOpen()"
    title="Supprimer les cycles sélectionnés ?"
    [itemName]="bulkDeleteItems().length + ' cycle(s)'"
    confirmMessage="Vous êtes sur le point de supprimer :"
    warningMessage="Cette action est irréversible."
    deleteButtonLabel="Supprimer"
    [requireConfirmation]="true"
    confirmationText="SUPPRIMER"
    (closeRequested)="closeBulkDelete()"
    (confirmDelete)="onBulkDeleteConfirmed()"
  ></app-delete-modal>

  <app-create-cycle-modal
    [open]="activeModal === 'create'"
    (closeRequested)="closeModal()"
    (createRequested)="onCreate($event)"
  ></app-create-cycle-modal>

  <app-edit-cycle-modal
    [open]="activeModal === 'edit'"
    [cycle]="selectedCycle"
    (closeRequested)="closeModal()"
    (updateRequested)="onUpdate($event)"
  ></app-edit-cycle-modal>

  <app-delete-cycle-modal
    [open]="activeModal === 'delete'"
    [cycle]="selectedCycle"
    (closeRequested)="closeModal()"
    (confirmDelete)="onDelete()"
  ></app-delete-cycle-modal>
</section>
