<section class="space-y-6">
  <app-page-header
    title="Structure académique"
    description="Organisez les années, cycles, filières, formations, groupes et modules de votre institution."
  ></app-page-header>

  <nav
    class="grid gap-2 rounded-3xl border border-line bg-surface p-2 shadow-card sm:grid-cols-2 xl:grid-cols-6 mt-5"
    aria-label="Navigation de la structure"
  >
    @for (unit of units; track unit.id) {
      <button
        type="button"
        class="flex min-h-20 items-center gap-3 rounded-2xl border px-3 py-3 text-left transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/25"
        [class.border-primary-soft]="unit.id === activeUnitId"
        [class.bg-primary-soft]="unit.id === activeUnitId"
        [class.border-transparent]="unit.id !== activeUnitId"
        [class.bg-surface-subtle]="unit.id !== activeUnitId"
        [class.hover:border-line-strong]="unit.id !== activeUnitId"
        (click)="setActiveUnit(unit.id)"
        [attr.aria-current]="unit.id === activeUnitId ? 'page' : null"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
          [class.bg-primary]="unit.id === activeUnitId"
          [class.text-white]="unit.id === activeUnitId"
          [class.bg-surface]="unit.id !== activeUnitId"
          [class.text-primary]="unit.id !== activeUnitId"
        >
          <i [class]="unit.icon" aria-hidden="true"></i>
        </span>
        <span class="min-w-0">
          <span class="block truncate text-sm font-semibold text-principalText">{{ unit.title }}</span>
          <span class="block truncate text-xs text-secondaryText">{{ unit.description }}</span>
        </span>
      </button>
    }
  </nav>

  @if (activeUnitId === 'academic-year') {
    <app-academic-year-page></app-academic-year-page>
  } @else if (activeUnitId === 'cycles') {
    <app-cycles-page></app-cycles-page>
  } @else if (activeUnitId === 'fields') {
    <app-fields-page></app-fields-page>
  } @else if (activeUnitId === 'formations') {
    <app-formations-page></app-formations-page>
  } @else if (activeUnitId === 'groupes') {
    <app-groupes-page></app-groupes-page>
  } @else {
    <app-modules-page></app-modules-page>
  }
</section>
