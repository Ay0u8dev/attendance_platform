<div
  class="chart-shell"
  [class.chart-shell-expanded]="expanded()"
  [class.chart-shell-interactive]="!expanded()"
  [attr.tabindex]="expanded() ? null : 0"
  [attr.role]="expanded() ? null : 'button'"
  [attr.aria-label]="expanded() ? null : 'Expand absence analytics chart'"
  (click)="requestExpand()"
  (keydown.enter)="requestExpand()"
  (keydown.space)="$event.preventDefault(); requestExpand()"
>
  @if (hasData()) {
    <p class="sr-only">{{ accessibleSummary() }}</p>
    <div class="chart-scroll" [class.chart-scroll-expanded]="expanded()">
      <svg
        class="chart"
        [attr.width]="width()"
        [attr.height]="height()"
        [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
        role="img"
        [attr.aria-label]="accessibleSummary()"
      >
        @for (tick of yTicks(); track tick.value) {
          <line class="grid-line" [attr.x1]="58" [attr.x2]="width() - 30" [attr.y1]="tick.y" [attr.y2]="tick.y"></line>
          <text class="axis-label axis-label-y" [attr.x]="46" [attr.y]="tick.y + 4">{{ tick.value }}</text>
        }

        <text class="axis-title" x="18" y="142" transform="rotate(-90 18 142)">Absences</text>
        <path class="area-path" [attr.d]="areaPath()"></path>
        <path class="line-path line-glow" [attr.d]="linePath()"></path>
        <path class="line-path" [attr.d]="linePath()"></path>

        @for (point of chartPoints(); track point.detail; let index = $index) {
          @if (shouldShowLabel(index)) {
            <line
              class="x-tick"
              [attr.x1]="point.x"
              [attr.x2]="point.x"
              [attr.y1]="xTickStart()"
              [attr.y2]="xTickEnd()"
            ></line>
            <text class="axis-label axis-label-x" [attr.x]="point.x" [attr.y]="xLabelY()">{{ point.label }}</text>
          }

          <g
            class="data-point"
            [class.data-point-peak]="point.isPeak"
            aria-hidden="true"
            (mouseenter)="showPoint(index)"
            (mouseleave)="hidePoint(index)"
          >
            @if (point.isPeak) {
              <circle class="peak-halo" [attr.cx]="point.x" [attr.cy]="point.y" r="12"></circle>
            }
            <circle class="point-hit-area" [attr.cx]="point.x" [attr.cy]="point.y" r="14"></circle>
            <circle class="point-marker" [attr.cx]="point.x" [attr.cy]="point.y" [attr.r]="point.isPeak ? 5.5 : 4"></circle>
          </g>
        }

        @if (activePoint(); as point) {
          <line
            class="cursor-line"
            [attr.x1]="point.x"
            [attr.x2]="point.x"
            [attr.y1]="plotTop"
            [attr.y2]="plotBottom()"
          ></line>
          <g class="chart-tooltip" [attr.transform]="'translate(' + tooltipX() + ' ' + tooltipY() + ')'">
            <rect width="210" height="76" rx="10"></rect>
            <text class="tooltip-title" x="13" y="21">{{ point.detail }}</text>
            <text class="tooltip-value" x="13" y="43">{{ point.absent }} absent</text>
            <text class="tooltip-meta" x="13" y="62">
              {{ point.sessions }} session(s) · {{ formatRate(point.rate) }} attendance
            </text>
          </g>
        }
      </svg>
    </div>

    <div class="chart-footer" aria-hidden="true">
      <span><i class="fa-solid fa-arrow-left-long"></i> Scroll to inspect the timeline</span>
      <span class="chart-legend"><span></span> Absence evolution</span>
    </div>
  } @else {
    <div class="empty-state">
      <span class="empty-state-icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span>
      <div>
        <p>No absences in this period</p>
        <span>Choose another range or time view to inspect historical attendance.</span>
      </div>
    </div>
  }
</div>
