<section class="space-y-6">
  <div class="space-y-4">
    @if (detail(); as d) {
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <app-status-badge [label]="statusLabel()" [variant]="statusVariant()"></app-status-badge>
        <div class="w-full sm:w-auto">
          <app-button
            label="Retour aux justifications"
            variant="outline"
            size="sm"
            [fullWidth]="true"
            (clicked)="goBack()"
          ></app-button>
        </div>
      </div>

      <div class="grid gap-4 xl:grid-cols-[0.95fr_1.35fr] xl:gap-6">
        <div class="grid gap-4 xl:gap-6">
          <app-justification-summary-card
            label="Séance concernée"
            [items]="sessionSummary()"
          ></app-justification-summary-card>

          <app-justification-summary-card
            label="Motif déclaré"
            [items]="reasonSummary()"
          ></app-justification-summary-card>

          <section
            class="rounded-[1.5rem] border border-line bg-surface p-4 shadow-card sm:rounded-[1.75rem] sm:p-5"
          >
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-secondaryText">
              Commentaire administratif
            </p>
            <p class="mt-4 text-sm leading-7 text-principalText">
              {{ d.teacherComment || 'Aucun commentaire administratif pour le moment.' }}
            </p>
          </section>

          <app-justification-timeline [items]="history()"></app-justification-timeline>
        </div>

        <div class="grid content-start gap-4 xl:gap-6">
          <app-document-preview-panel
            [fileName]="attachmentName()"
            [previewUrl]="previewUrl()"
            [downloadUrl]="downloadUrl()"
            previewDescription="Aperçu indisponible. Téléchargez le fichier pour le consulter."
          ></app-document-preview-panel>
        </div>
      </div>
    } @else {
      <div
        class="flex h-[40vh] items-center justify-center rounded-[1.75rem] border border-line bg-surface shadow-card"
      >
        <div class="flex flex-col items-center gap-3">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-primary" aria-hidden="true"></i>
          <p class="text-sm font-semibold text-secondaryText">Chargement du dossier...</p>
        </div>
      </div>
    }
  </div>
</section>
